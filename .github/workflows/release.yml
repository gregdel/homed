name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend build tooling
        shell: sh
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin
          if ! command -v magick >/dev/null 2>&1; then
            mkdir -p /tmp/imagemagick-bin
            printf '#!/bin/sh\nexec convert "$@"\n' > /tmp/imagemagick-bin/magick
            chmod +x /tmp/imagemagick-bin/magick
            echo /tmp/imagemagick-bin >> "$GITHUB_PATH"
          fi

      - name: Build
        env:
          GOOS: linux
          GOARCH: amd64
        run: ./build.sh

      - name: Package artifact
        shell: sh
        run: |
          mkdir -p artifacts
          cp homed artifacts/homed_linux_amd64
          cp config-example.yaml artifacts/config-example.yaml
          cd artifacts
          sha256sum homed_linux_amd64 > homed_linux_amd64.sha256sum

      - name: Create tag
        id: tag
        shell: sh
        run: echo "tag=$(date -u '+%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.tag }}
          make_latest: true
          files: artifacts/*
