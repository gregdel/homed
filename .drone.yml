kind: pipeline
name: default

steps:

- name: frontend
  image: node:16-alpine3.14
  commands:
  - ./build.sh frontend

- name: golang
  image: golang:1.17.0-alpine3.14
  commands:
  - ./build.sh backend

- name: release
  image: plugins/gitea-release
  settings:
    base_url: https://git.quimbo.fr
    title: "Release ${DRONE_TAG}"
    files: ./homed
    api_key:
      from_secret: gitea_token
  when:
    event: tag
